<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <radialGradient id="bodyGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </radialGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Pata izquierda -->
  <path d="M 28 82 L 34 50 L 40 50 L 36 82 L 42 98 L 22 98 Z" fill="#94a3b8" stroke="#0f172a" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="20" y="96" width="24" height="6" rx="3" fill="#64748b" stroke="#0f172a" stroke-width="1.5"/>

  <!-- Pata derecha -->
  <path d="M 92 82 L 86 50 L 80 50 L 84 82 L 78 98 L 98 98 Z" fill="#94a3b8" stroke="#0f172a" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="76" y="96" width="24" height="6" rx="3" fill="#64748b" stroke="#0f172a" stroke-width="1.5"/>

  <!-- Pata central delantera -->
  <path d="M 52 85 L 68 85 L 70 98 L 50 98 Z" fill="#cbd5e1" stroke="#0f172a" stroke-width="1.5"/>
  <rect x="46" y="96" width="28" height="6" rx="3" fill="#64748b" stroke="#0f172a" stroke-width="1.5"/>

  <!-- Cuerpo cilíndrico principal -->
  <rect x="36" y="44" width="48" height="42" rx="4" fill="url(#bodyGrad)" stroke="#0f172a" stroke-width="2"/>

  <!-- Paneles azules del cuerpo -->
  <rect x="40" y="48" width="12" height="18" rx="2" fill="url(#blueGrad)" stroke="#0f172a" stroke-width="1"/>
  <rect x="68" y="48" width="12" height="18" rx="2" fill="url(#blueGrad)" stroke="#0f172a" stroke-width="1"/>
  <rect x="54" y="52" width="12" height="6" rx="1.5" fill="#38bdf8"/>
  <rect x="40" y="70" width="40" height="4" rx="1" fill="#38bdf8"/>
  <circle cx="60" cy="79" r="3" fill="#ef4444" filter="url(#glow)"/>
  <circle cx="50" cy="79" r="2" fill="#22c55e"/>
  <circle cx="70" cy="79" r="2" fill="#eab308"/>

  <!-- Cúpula / Cabeza domo -->
  <path d="M 36 44 A 24 24 0 0 1 84 44 Z" fill="url(#bodyGrad)" stroke="#0f172a" stroke-width="2"/>

  <!-- Banda azul de la cúpula -->
  <path d="M 37 40 L 83 40 L 84 44 L 36 44 Z" fill="url(#blueGrad)"/>

  <!-- Ojo / Sensor principal radar -->
  <circle cx="60" cy="30" r="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <circle cx="60" cy="30" r="3.5" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="59" cy="28.5" r="1.2" fill="#ffffff"/>

  <!-- Luz del proyector holográfico -->
  <circle cx="72" cy="34" r="2.5" fill="#ef4444" filter="url(#glow)"/>

  <!-- Antena / Sensor superior -->
  <line x1="60" y1="20" x2="60" y2="13" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  <circle cx="60" cy="12" r="2" fill="#38bdf8" filter="url(#glow)"/>
</svg>
